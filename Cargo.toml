[workspace]
members = [
    "crates/trim-core",
    "crates/trim-commands",
    "crates/trim-timeline",
    "crates/trim-project",
    "crates/trim-media",
    "crates/trim-export",
    "crates/trim-ui",
    "crates/trim-app",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["triM. contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MOzcelik14/triM"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.15"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

