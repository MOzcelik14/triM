name: Build & Release Multiplatform Packages

on:
  push:
    branches: [master]
    tags:
      - "v[0-9]*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "resources/**"
      - "install.sh"
      - "install.ps1"
      - "scripts/package-linux.sh"
      - ".github/workflows/release-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trim-release-${{ github.ref }}
  # On master, only the newest commit needs distributable CI artifacts.
  # Tagged releases must never be cancelled by later pushes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            pkg-config build-essential libasound2-dev libpipewire-0.3-dev libx11-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev ffmpeg
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

  deb-appimage:
    name: Ubuntu build · deb + AppImage + tar.gz
    needs: rust-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packaging requirements
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20"
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout="20" \
            pkg-config build-essential libasound2-dev libpipewire-0.3-dev libx11-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev ffmpeg curl file desktop-file-utils xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libegl1 mesa-utils ca-certificates python3
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Build optimized native executable
        run: cargo build --locked --release -p trim-app
      - name: Build Debian package
        run: bash scripts/package-linux.sh deb
      - name: Build AppImage
        run: bash scripts/package-linux.sh appimage
      - name: Build portable Linux tarball
        run: bash scripts/package-linux.sh tarball
      - name: Validate Debian, AppImage, and portable tarball outputs
        run: |
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          dpkg-deb -f dist/*.deb Package Version Architecture
          test -x target/release/trim
          bash -n scripts/package-linux.sh
      - name: Smoke test installed Debian binary in a virtual desktop
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb -x dist/*.deb "$stage"
          grep -Fqx 'Exec=/usr/bin/trim %F' "$stage/usr/share/applications/trim.desktop"
          test -x "$stage/usr/bin/trim"
          # Headless GUI needs software OpenGL; timeout 124 means app remained open.
          set +e
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe RUST_BACKTRACE=1 \
            timeout 15s "$stage/usr/bin/trim" > "$stage/launch.log" 2>&1
          status=$?
          set -e
          cat "$stage/launch.log"
          if [[ "$status" -ne 124 ]]; then
            echo "GUI failed or exited early (status $status)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: trim-ubuntu-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Fedora build · rpm
    needs: rust-tests
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install native build and packaging tools
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel pipewire-devel libX11-devel mesa-libGL-devel libxkbcommon-devel wayland-devel ffmpeg-free rpm-build curl ca-certificates python3 rust cargo
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Rust binary on Fedora
        run: cargo build --locked --release -p trim-app
      - name: Package RPM
        run: bash scripts/package-linux.sh rpm
      - name: Validate RPM
        run: |
          test "$(find dist -name '*.rpm' | wc -l)" -eq 1
          rpm -qpl dist/*.rpm | grep -E '/usr/bin/trim$'
      - uses: actions/upload-artifact@v4
        with:
          name: trim-fedora-package
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows build · zip (MSVC)
    needs: rust-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Check Windows workspace
        run: cargo check --workspace --locked
      - name: Test Windows workspace
        run: cargo test --workspace --locked
      - name: Build Windows binary
        run: cargo build --locked --release -p trim-app
      - name: Acquire FFmpeg binaries for Windows release bundle
        shell: pwsh
        run: |
          $stageBin = Join-Path $env:TEMP "ffmpeg-bin"
          New-Item -ItemType Directory -Path $stageBin -Force | Out-Null

          # Strategy 1: Check runner preinstalled binaries
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue)?.Source
          $probe = (Get-Command ffprobe -ErrorAction SilentlyContinue)?.Source
          $play = (Get-Command ffplay -ErrorAction SilentlyContinue)?.Source

          if (-not $ff -and (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe")) {
            $ff = "C:\ProgramData\chocolatey\bin\ffmpeg.exe"
          }
          if (-not $probe -and (Test-Path "C:\ProgramData\chocolatey\bin\ffprobe.exe")) {
            $probe = "C:\ProgramData\chocolatey\bin\ffprobe.exe"
          }
          if (-not $play -and (Test-Path "C:\ProgramData\chocolatey\bin\ffplay.exe")) {
            $play = "C:\ProgramData\chocolatey\bin\ffplay.exe"
          }

          # Strategy 2: Chocolatey installation
          if (-not $ff -or -not $probe) {
            Write-Host "Installing FFmpeg via Chocolatey..."
            choco install ffmpeg -y --no-progress
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe") {
              $ff = "C:\ProgramData\chocolatey\bin\ffmpeg.exe"
            }
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffprobe.exe") {
              $probe = "C:\ProgramData\chocolatey\bin\ffprobe.exe"
            }
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffplay.exe") {
              $play = "C:\ProgramData\chocolatey\bin\ffplay.exe"
            }
          }

          # Strategy 3: Official static essentials download
          if (-not $ff -or -not $probe) {
            Write-Host "Downloading official FFmpeg release essentials..."
            $ffZip = Join-Path $env:TEMP "ffmpeg-essentials.zip"
            $ffExt = Join-Path $env:TEMP "ffmpeg-essentials-ext"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffZip -UseBasicParsing
            Expand-Archive -Path $ffZip -DestinationPath $ffExt -Force
            $ff = (Get-ChildItem -Path $ffExt -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1)?.FullName
            $probe = (Get-ChildItem -Path $ffExt -Filter "ffprobe.exe" -Recurse | Select-Object -First 1)?.FullName
            $play = (Get-ChildItem -Path $ffExt -Filter "ffplay.exe" -Recurse | Select-Object -First 1)?.FullName
          }

          Write-Host "Acquired FFmpeg: $ff"
          Write-Host "Acquired FFprobe: $probe"

          if (-not $ff -or -not $probe) {
            Write-Error "FFmpeg/FFprobe binaries could not be acquired for Windows packaging."
            exit 1
          }

          Copy-Item -Path $ff -Destination (Join-Path $stageBin "ffmpeg.exe") -Force
          Copy-Item -Path $probe -Destination (Join-Path $stageBin "ffprobe.exe") -Force
          if ($play -and (Test-Path $play)) {
            Copy-Item -Path $play -Destination (Join-Path $stageBin "ffplay.exe") -Force
          }
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $rawVer = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($rawVer) -or $rawVer -notlike "v*") {
            $ver = "1.3.0"
          } else {
            $ver = $rawVer.TrimStart('v')
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $stage = Join-Path $env:TEMP "trim-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "bin") -Force | Out-Null

          Copy-Item -Path "target\release\trim.exe" -Destination $stage -Force
          Copy-Item -Path "resources" -Destination $stage -Recurse -Force
          Copy-Item -Path "README.md" -Destination $stage -Force
          Copy-Item -Path "install.ps1" -Destination $stage -Force

          # Copy FFmpeg binaries to root and bin/ of package
          $stageBin = Join-Path $env:TEMP "ffmpeg-bin"
          if (Test-Path $stageBin) {
            Copy-Item -Path "$stageBin\*.exe" -Destination $stage -Force
            Copy-Item -Path "$stageBin\*.exe" -Destination (Join-Path $stage "bin") -Force
          }

          # Verify mandatory binaries
          if (-not (Test-Path (Join-Path $stage "trim.exe"))) { throw "trim.exe missing from package" }
          if (-not (Test-Path (Join-Path $stage "ffmpeg.exe"))) { throw "ffmpeg.exe missing from package root" }
          if (-not (Test-Path (Join-Path $stage "ffprobe.exe"))) { throw "ffprobe.exe missing from package root" }
          if (-not (Test-Path (Join-Path $stage "bin\ffmpeg.exe"))) { throw "ffmpeg.exe missing from package bin/" }
          if (-not (Test-Path (Join-Path $stage "bin\ffprobe.exe"))) { throw "ffprobe.exe missing from package bin/" }

          $runtimeNotes = @"
          triM. v$ver (Windows x86_64 MSVC)
          ===================================
          Bu paket, triM. ile birlikte calismaya hazir tasinabilir FFmpeg ve FFprobe
          ikili dosyalarini icermektedir (ffmpeg.exe, ffprobe.exe).
          Ekstra bir kuruluma gerek kalmadan dogrudan trim.exe calistirilabilir.

          Calisma Zamani Arama Sirasi:
          1. <uygulama_dizini>\ffmpeg.exe ve <uygulama_dizini>\bin\ffmpeg.exe
          2. %LOCALAPPDATA%\triM\bin\ffmpeg.exe
          3. TRIM_FFMPEG_PATH / TRIM_FFPROBE_PATH ortam degiskenleri
          4. Sistem PATH degiskeni
          "@
          Set-Content -Path (Join-Path $stage "WINDOWS_RUNTIME.txt") -Value $runtimeNotes -Encoding UTF8
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\triM-$ver-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: trim-windows-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [deb-appimage, rpm, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trim-*-package*
          merge-multiple: true
          path: dist
      - name: Verify package set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          (cd dist && sha256sum -- *.deb *.rpm *.AppImage *.tar.gz *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create or update release with all packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true


