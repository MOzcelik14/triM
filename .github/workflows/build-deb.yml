# Legacy Python/PySide6 edition only. Rust packages are built by release-linux.yml.
name: Legacy Python regression tests

on:
  push:
    branches: [master]
    paths:
      - "trim/**"
      - "cutline/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-deb.yml"
  pull_request:
    branches: [master]
    paths:
      - "trim/**"
      - "cutline/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python GUI tests (headless)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run legacy tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
