name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Format, Lint, Test, and Release Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            ffmpeg

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit and integration tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Validate Linux packaging script syntax
        run: bash -n scripts/package-linux.sh

  windows-ci:
    name: Windows MSVC Check, Test, and Release Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Windows workspace compilation
        run: cargo check --workspace --locked

      - name: Run Clippy linter on Windows target
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Windows workspace unit and integration tests
        run: cargo test --workspace --locked

      - name: Build Windows release binary
        run: cargo build --workspace --release --locked

