name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Format, Lint, Test, and Release Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            ffmpeg

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace crate boundaries
        run: bash scripts/check-boundaries

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run strict panic-free Clippy check
        run: cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable

      - name: Run workspace unit and integration tests
        run: cargo test --workspace --locked

      - name: Measure test coverage with cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 38

      - name: Security audit and license check
        uses: embarkstudios/cargo-deny-action@v2

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Build perf_bench example (compile check only)
        run: cargo build --release -p trim-media --example perf_bench --locked

      - name: Validate Linux packaging script syntax
        run: bash -n scripts/package-linux.sh

      - name: Validate desktop entry and AppStream metainfo
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate trim.desktop
          appstreamcli validate trim.metainfo.xml

  fedora-ci:
    name: Fedora 41 Check and Test
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install Fedora system dependencies
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel pipewire-devel libX11-devel mesa-libGL-devel libxkbcommon-devel wayland-devel ffmpeg-free rust cargo desktop-file-utils appstream
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run workspace unit and integration tests on Fedora
        run: cargo test --workspace --locked
      - name: Validate desktop and metainfo on Fedora
        run: |
          desktop-file-validate trim.desktop
          appstreamcli validate trim.metainfo.xml

  windows-ci:
    name: Windows MSVC Check, Test, and Release Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install FFmpeg for Windows tests
        run: choco install ffmpeg -y --no-progress

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Windows workspace compilation
        run: cargo check --workspace --locked

      - name: Run Clippy linter on Windows target
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Windows workspace unit and integration tests
        run: cargo test --workspace --locked

      - name: Build Windows release binary
        run: cargo build --workspace --release --locked

