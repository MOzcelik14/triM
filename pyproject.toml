[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline"
version = "0.1.0"
description = "Modern, fast, and robust non-linear video editor for Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "av>=12.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
cutline = "cutline.main:main"
